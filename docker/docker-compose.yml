version: "3.8"

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9191"
    ports:
      - "9190:9000"   # MinIO API
      - "9191:9191"   # MinIO Console (đã đổi port nội bộ khớp với command)
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minio minio123;
      mc mb -p myminio/j2n-user;
      mc mb -p myminio/j2n-product;
      mc mb -p myminio/j2n-room;
      mc mb -p myminio/j2n-travel;
      mc mb -p myminio/j2n-default;
      mc ls myminio;
      exit 0;
      "

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "9192:5672"    # AMQP
      - "9193:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass yourpassword123
    ports:
      - "9194:6379"    # Redis
    volumes:
      - redis-data:/data

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    restart: unless-stopped
    ports:
      - "9195:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "hvsCAESIExampleLocalDevToken1234567890abcdef"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/file

  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init
    depends_on:
      - vault
    volumes:
      - ./vault-init.sh:/vault-init.sh
      - ./vault-secrets.env:/vault-secrets.env
    environment:
      VAULT_TOKEN: "hvsCAESIExampleLocalDevToken1234567890abcdef"
    entrypoint: /bin/sh /vault-init.sh

volumes:
  minio-data:
  rabbitmq-data:
  redis-data:
  vault-data: