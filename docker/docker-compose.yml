version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console

    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minio minio123;
      mc mb -p myminio/j2n-user;
      mc mb -p myminio/j2n-product;
      mc mb -p myminio/j2n-room;
      mc mb -p myminio/j2n-default;
      mc mb -p myminio/j2n-travel;
      mc ls myminio;
      exit 0;
      "

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped

    ports:
      - "8280:5672"    # AMQP (custom external port)
      - "8281:15672"   # Management UI

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  minio-data:
  rabbitmq-data:
