mutation Op_createProduct($input: ProductInput!) {
  createProduct(input: $input) {
    code
    message
    data {
      id
      title
      description
      price
      thumbnail
      duration
      startLocation
      type
      createdAt
      updatedAt
      category {
        id
        name
        slug
        type
      }
    }
  }
}

mutation Op_updateProduct($id: ID!, $input: ProductInput!) {
  updateProduct(id: $id, input: $input) {
    code
    message
    data {
      id
      title
      description
      price
      thumbnail
      duration
      startLocation
      type
      createdAt
      updatedAt
      category {
        id
        name
        slug
      }
    }
  }
}

mutation Op_deleteProduct($id: ID!) {
  deleteProduct(id: $id) {
    code
    message
    data
  }
}
