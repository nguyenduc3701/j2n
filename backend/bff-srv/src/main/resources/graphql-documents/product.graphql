query Op_getAllProducts {
  getAllProducts {
    code
    message
    data {
      id
      title
      description
      price
      thumbnail
      duration
      startLocation
      type
      createdAt
      updatedAt
      category {
        id
        name
        slug
        type
      }
      schedules {
        id
        dayNumber
        title
        content
      }
      images {
        id
        imageUrl
        isPrimary
      }
    }
  }
}

