query Op_getAllTours {
  getAllTours {
    code
    message
    data {
      id
      title
      description
      price
      thumbnail
      duration
      startLocation
      createdAt
      updatedAt
      category {
        id
        name
        slug
      }
      schedules {
        id
        dayNumber
        title
        content
      }
      images {
        id
        imageUrl
        isPrimary
      }
    }
  }
}

query Op_getTourById($id: ID!) {
  getTourById(id: $id) {
    code
    message
    data {
      id
      title
      description
      price
      thumbnail
      duration
      startLocation
      createdAt
      updatedAt
      category {
        id
        name
        slug
      }
      schedules {
        id
        dayNumber
        title
        content
      }
      images {
        id
        imageUrl
        isPrimary
      }
    }
  }
}

