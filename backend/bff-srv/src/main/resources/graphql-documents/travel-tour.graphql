mutation Op_createTour($input: TourInput!) {
  createTour(input: $input) {
    code
    message
    data {
      id
      title
      description
      price
      thumbnail
      duration
      startLocation
      createdAt
      updatedAt
      category {
        id
        name
        slug
      }
    }
  }
}

mutation Op_updateTour($id: ID!, $input: TourInput!) {
  updateTour(id: $id, input: $input) {
    code
    message
    data {
      id
      title
      description
      price
      thumbnail
      duration
      startLocation
      createdAt
      updatedAt
      category {
        id
        name
        slug
      }
    }
  }
}

mutation Op_deleteTour($id: ID!) {
  deleteTour(id: $id) {
    code
    message
    data
  }
}
