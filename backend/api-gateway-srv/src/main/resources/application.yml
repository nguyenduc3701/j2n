spring:
  profiles:
    active: dev
  application:
    name: api-gateway-srv
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  codec:
    max-in-memory-size: ${api-gateway.max-in-memory-size}
  webflux:
    base-path: /
    multipart:
      max-file-size: ${application.multipart.max-file-size}
      max-request-size: ${application.multipart.max-request-size}
  data:
    redis:
      host: ${application.redis.host}
      port: ${application.redis.port}
      password: ${application.redis.password}
  config:
    import: optional:configserver:${VAULT_URL:http://localhost:8185}
  cloud:
    config:
      token: ${VAULT_TOKEN}
    gateway:
      grpc:
        enabled: true
      json-to-grpc:
        enabled: true
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-srv
          uri: ${api-gateway.auth.base-url}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"
        - id: image-srv
          uri: ${api-gateway.image.base-url}
          predicates:
            - Path=/api/image/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: report-srv
          uri: grpc://localhost:18184
          predicates:
            - Path=/api/report/**
          filters:
            - name: JsonToGrpc
              args:
                protoDescriptor: classpath:descriptor_set.bin
                service: com.example.j2n.lib.proto.ReportService
                method: GetDashboardReport
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: reportCircuitBreaker
                fallbackUri: forward:/fallback/report
jwt:
  expiration-ms: ${application.jwt.expiration-ms}
  clock-skew-seconds: ${application.jwt.clock-skew-seconds}
server:
  port: 8181
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.example.j2n: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: "*"
resilience4j.circuitbreaker:
  configs:
    default:
      registerHealthIndicator: true
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 5s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
  instances:
    reportCircuitBreaker:
      baseConfig: default
resilience4j.timelimiter:
  configs:
    default:
      timeoutDuration: 3s
      cancelRunningFuture: true
