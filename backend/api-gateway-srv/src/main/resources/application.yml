spring:
  profiles:
    active: dev
  application:
    name: api-gateway-srv
  codec:
    max-in-memory-size: ${api-gateway.max-in-memory-size}
  webflux:
    base-path: /
    multipart:
      max-file-size: ${application.multipart.max-file-size}
      max-request-size: ${application.multipart.max-request-size}
  data:
    redis:
      host: ${application.redis.host}
      port: ${application.redis.port}
      password: ${application.redis.password}
  config:
    import: optional:configserver:${VAULT_URL:http://localhost:8185}
  cloud:
    config:
      token: ${VAULT_TOKEN}
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-srv
          uri: ${api-gateway.auth.base-url}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"
        - id: image-srv
          uri: ${api-gateway.image.base-url}
          predicates:
            - Path=/api/image/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: report-srv
          uri: ${api-gateway.report.base-url}
          predicates:
            - Path=/api/report/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@userKeyResolver}"
        - id: config-srv
          uri: ${VAULT_URL}
          predicates:
            - Path=/api/centralize/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"
        - id: product-srv
          uri: ${api-gateway.product.base-url:http://localhost:8186}
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"
        - id: order-srv
          uri: ${api-gateway.order.base-url}
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"
        - id: payment-srv
          uri: ${api-gateway.payment.base-url}
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"
        - id: room-srv
          uri: ${api-gateway.room.base-url:http://localhost:8189}
          predicates:
            - Path=/api/room/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"
        - id: notification-srv
          uri: ${api-gateway.notification.base-url:http://localhost:8190}
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"
      filter:
        request-rate-limiter:
          redis-rate-limiter:
            replenishRate: 2
            burstCapacity: 5

jwt:
  expiration-ms: ${application.jwt.expiration-ms}
  clock-skew-seconds: ${application.jwt.clock-skew-seconds}
server:
  port: 8181
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.example.j2n: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: "*"
