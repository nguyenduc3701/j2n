spring:
  application:
    name: api-gateway-srv

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-srv
          uri: http://localhost:8182
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

jwt:
  secret: ${JWT_SECRET:J2N-X9mN2bV4cL7pQ1rS8tY6hJ3kD5fW0eGhKiPoLmNzRqStUvWxYApiGatewaySrv}
  expiration-ms: ${JWT_EXPIRATION_MS:172800000}

server:
  port: 8181

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
