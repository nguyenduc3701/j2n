version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web Console

    volumes:
      - minio-data:/data

volumes:
  minio-data:
