syntax = "proto3";

package com.example.j2n.report;

option java_multiple_files = true;
option java_package = "com.example.j2n.lib.grpc.report";
option java_outer_classname = "ReportProto";

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

service ReportGrpcService {
  rpc GetDashboardReport(google.protobuf.Empty) returns (DashboardReportGrpcResponse) {
    option (google.api.http) = {
      get: "/api/report/management/dashboard"
    };
  }
}

message DashboardReportGrpcResponse {
  repeated SummaryMetrics summaryMetrics = 1;
  repeated MonthlyFinancials monthlyFinancials = 2;
  repeated RoomUtilityReport roomUtilityReports = 3;
  repeated DistributionChart distributionCharts = 4;
  repeated ActivePromotion activePromotions = 5;
}

message SummaryMetrics {
  string metricKey = 1;
  string category = 2;
  int64 metricValue = 3;
  string updatedAt = 4; // ISO format
}

message MonthlyFinancials {
  int32 id = 1;
  string monthYear = 2;
  string domain = 3;
  string totalIncome = 4; // Represent BigDecimal as string
  int32 totalOrders = 5;
  string remainingAmount = 6; // Represent BigDecimal as string
}

message RoomUtilityReport {
  string monthYear = 1;
  string totalElectricity = 2; // Represent BigDecimal as string
  string totalWater = 3; // Represent BigDecimal as string
  string updatedAt = 4; // ISO format
}

message DistributionChart {
  string chartType = 1;
  string itemLabel = 2;
  int64 itemValue = 3;
}

message ActivePromotion {
  string promoId = 1;
  string domain = 2;
  string promoName = 3;
  string endDate = 4; // ISO format
}
