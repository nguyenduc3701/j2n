services:
  postgres:
    image: postgres:15
    container_name: postgres
    # Thêm dòng này nếu bạn dùng Mac chip M1/M2/M3 để đảm bảo ổn định
    platform: linux/arm64
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    # volumes:
    #   - keycloak_data:/var/lib/postgresql/data
    networks:
      - shared-network
    healthcheck:
      # Sử dụng user 'keycloak' thay vì mặc định
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:15
    container_name: db-init
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - shared-network
    command: >
      sh -c "
      until pg_isready -h postgres -p 5432 -U keycloak; do
        echo 'Waiting for postgres...';
        sleep 2;
      done;
      psql postgresql://keycloak:keycloak@postgres:5432/keycloak
      -c 'CREATE SCHEMA IF NOT EXISTS keycloak;'
      -c 'CREATE SCHEMA IF NOT EXISTS flowable;'
      "

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    # restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: start-dev --http-relative-path /auth
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_PROXY_HEADERS: xforwarded

      # KC_HOSTNAME_URL: http://keycloak:8080/auth
      KC_HTTP_RELATIVE_PATH: /auth
    ports:
      - "8081:8080"
    networks:
      - shared-network
networks:
  shared-network:
    external: true
    name: flowable-keycloak-net
volumes:
  keycloak_data: